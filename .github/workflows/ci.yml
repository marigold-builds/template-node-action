name: ci
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm test
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: act
        uses: ./
        with: { who: ci }
      - run: test "${{ steps.act.outputs.greeting }}" = "hello, ci"
